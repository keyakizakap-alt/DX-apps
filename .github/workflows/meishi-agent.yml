name: meishi-agent

on:
  pull_request:
    paths: ['apps/meishi-agent/**', '.github/workflows/meishi-agent.yml']
  push:
    branches: [main]
    paths: ['apps/meishi-agent/**', '.github/workflows/meishi-agent.yml']

permissions:
  contents: read

concurrency:
  group: meishi-agent-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/meishi-agent

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # The runner's cached 24.x can predate security releases; engines in
          # package.json rejects it (engine-strict), so always fetch the latest.
          check-latest: true
          cache: npm
          cache-dependency-path: apps/meishi-agent/package-lock.json
      - run: npm ci
      - name: Dependency audit (runtime gate)
        run: npm run audit
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit, integration and security tests
        run: npm test
      - name: Web build (with DEMO loader for E2E only)
        run: npm run build:web:demo
      - name: Japanese font for the OCR E2E card
        run: sudo apt-get update && sudo apt-get install -y fonts-ipafont-gothic
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Browser E2E (Chromium; not a substitute for iPhone/Android devices)
        run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: meishi-agent-e2e
          path: apps/meishi-agent/test-results/e2e
          retention-days: 7
