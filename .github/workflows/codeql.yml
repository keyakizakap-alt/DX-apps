name: CodeQL

# コードの脆弱性パターン（XSS・インジェクション・安全でない正規表現など）を自動で検出する。
# 公開リポジトリでは無料。結果は Security タブの Code scanning に表示される。
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:javascript-typescript
