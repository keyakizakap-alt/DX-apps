<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A64B8"/>
      <stop offset="1" stop-color="#143867"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF3FA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1F3D" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g id="background"><rect width="1024" height="1024" fill="url(#bg)"/></g>
  <g id="mark">
    <!-- back card -->
    <rect x="236" y="300" width="560" height="340" rx="40" fill="#FFFFFF" opacity="0.28" transform="rotate(-8 516 470)"/>
    <!-- front card -->
    <g filter="url(#shadow)">
      <rect x="212" y="352" width="600" height="360" rx="44" fill="url(#card)"/>
    </g>
    <circle cx="340" cy="482" r="58" fill="#2156A5"/>
    <circle cx="340" cy="466" r="22" fill="#FFFFFF"/>
    <path d="M300 520 a40 32 0 0 1 80 0 z" fill="#FFFFFF"/>
    <rect x="432" y="442" width="260" height="30" rx="15" fill="#173F7A"/>
    <rect x="432" y="496" width="190" height="22" rx="11" fill="#9DB3D1"/>
    <rect x="270" y="594" width="300" height="20" rx="10" fill="#C9D6E8"/>
    <rect x="270" y="636" width="220" height="20" rx="10" fill="#C9D6E8"/>
    <!-- lock badge -->
    <g transform="translate(700 640)">
      <circle r="92" fill="#1E6B47" stroke="#FFFFFF" stroke-width="16"/>
      <path d="M-30 -14 v-20 a30 30 0 0 1 60 0 v20" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"/>
      <rect x="-44" y="-16" width="88" height="66" rx="14" fill="#FFFFFF"/>
      <circle cy="14" r="10" fill="#1E6B47"/>
    </g>
  </g>
</svg>
