template-columns:minmax(290px,1.05fr) minmax(320px,1fr);gap:17px}.records{padding:0;overflow:hidden}.record{display:flex;align-items:center;gap:12px;padding:17px 18px;border-bottom:1px solid #eff2f5;cursor:pointer}.record:last-child{border:0}.record.active,.record:hover{background:#f2f6fc}.record .grow{min-width:0;flex:1}.record small{color:#77889b}.detailhead{display:flex;gap:15px;align-items:center;margin-bottom:20px}.person-title{font-size:24px;font-weight:800;color:var(--navy)}.line{border:0;border-top:1px solid var(--line);margin:17px 0}.data-row{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:9px 0;font-size:13px}.data-row dt{color:var(--muted)}.data-row dd{margin:0;overflow-wrap:anywhere}.cardimage{border:1px solid #dce5ef;border-radius:10px;background:linear-gradient(125deg,#fff 65%,#f3f6fa);height:155px;box-shadow:0 3px 12px rgba(20,50,77,.05);padding:22px 24px;color:#173653;display:flex;flex-direction:column;justify-content:space-between}.cardimage .fake-logo{font-size:12px;letter-spacing:.15em;color:#56748c;font-weight:750}.cardimage .fake-name{font-size:20px;font-weight:800}.cardimage .fake-sub{font-size:10px;color:#62758b}.scanarea{border:2px dashed #b6c9df;background:#f3f7fc;border-radius:14px;min-height:236px;display:flex;align-items:center;justify-content:center;text-align:center;padding:26px;flex-direction:column;gap:9px}.scanarea strong{font-size:17px;color:#24496f}.scanarea .big-icon{font-size:33px;font-weight:300;color:#4e79ac}.queueitem{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.queueitem:last-child{border:0}.queueitem strong{font-size:13px}.progress{height:6px;background:#e5ebf3;border-radius:20px;overflow:hidden;margin:10px 0}.progress i{height:100%;background:#2b68ae;display:block}.review{display:grid;grid-template-columns:minmax(240px,.85fr) minmax(270px,1.15fr);gap:17px}.review .cardimage{height:210px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:15px}.comparison .c <body>
<!-- 架空のUIデモです。実在する名刺や本番データを取り込まないでください。 -->
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></symbol>

</defs></svg>
<div id="app"></div>
<script>
const icon=(id)=>`<svg class="icon" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const demoPeople=[
{id:'c1',name:'山田 花子',company:'青葉ネットワーク株式会社',job:'営業企画部 マネージャー',event:'九州IT交流会',date:'2026/10/18',email:'hanako@example.invalid',phone:'090-0000-0001',tags:['ネットワーク','福岡'],color:'',memo:'セキュリティ運用に関心。次回はVPN構成の話題。',status:'確認済み'},
{id:'c2',name:'佐藤 健二',company:'未来クラウド研究所',job:'クラウドアーキテクト',event:'クラウド技術勉強会',date:'2026/10/16',email:'kenji@example.invalid',phone:'090-0000-0002',tags:['AWS','技術'],color:'sage',memo:'ハンズオンの発表者。資料送付の約束。',status:'要確認'},
{id:'c3',name:'高橋 美咲',company:'長崎デザイン合同会社',job:'プロダクトデザイナー',event:'長崎クリエイター交流会',date:'2026/10/11',email:'misaki@example.invalid',phone:'090-0000-0003',tags:['デザイン','長崎'],color:'peach',memo:'UXリサーチに関心。',status:'確認済み'},
{id:'c4',name:'森 拓海',company:'九州データシステムズ',job:'エンジニア',event:'九州IT交流会',date:'2026/10/09',email:'takumi@example.invalid',phone:'090-0000-0004',tags:['AI','技術'],color:'sage',memo:'生成AIの評価方法について相談。',status:'確認済み'}
];
const state={page:'home',selected:'c1',people:demoPeople,search:'',review:{name:'佐藤 健二',company:'未来クラウド研究所',email:'kenji@example.invalid',job:'クラウドアーキテクト'},queue:3,done:2,external:false,approved:false,aiText:'',chat:[],lock:false,filter:'すべて'};
const route={home:'ホーム',people:'名刺一覧',scan:'名刺取り込み',ai:'AIアシスタント',settings:'設定',queue:'取り込みキュー',review:'OCR確認',duplicates:'重複候補',person:'人物詳細',approve:'AIへの送信確認',sync:'暗号化同期',audit:'操作履歴',export:'データの書き出し',welcome:'はじめに',recover:'復旧キー',unlock:'ロック解除',conflicts:'競合の確認'};
const mainNav=[['home','home','ホーム'],['people','users','名刺'],['scan','scan','取込'],['ai','spark','AI'],['settings','gear','設定']];
function e(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
function btn(t,to,cls=''){return `<button class="btn ${cls}" type="button" data-page="${to}">${t}</button>`;}
function stat(t,num,desc){return `<div class="stat"><div class="t">${t}</div><strong>${num}</strong><small>${desc}</small></div>`;}
function avatar(p){return `<div class="miniavatar ${p.color||''}">${e(p.name.split(' ')[0].slice(0,1))}</div>`;}
function rowperson(p){return `<div class="personrow" data-person="${p.id}" role="button" tabindex="0">${avatar(p)}<div><div class="pname">${e(p.name)}</div><div class="meta">${e(p.company)} ・ ${e(p.date)}</div></div>${p.status==='要確認'?'<span class="pill warn">要確認</span>':''}<span class="arrow">›</span></div>`;}
function title(t,desc,action=''){return `<div class="headline"><div><div class="eyebrow">SECURE CONTACTS / UI DEMO</div><h1>${t}</h1>${desc?`<p class="subtitle">${desc}</p>`:''}</div>${action}</div>`;}
function cardImage(p){return `<div class="cardimage"><div class="fake-logo">${e(p.company)}</div><div><div class="fake-sub">${e(p.job)}</div><div class="fake-name">${e(p.name)}</div><div class="fake-sub">${e(p.email)}<br>${e(p.phone)}</div></div></div>`;}
function home(){return title('名刺を、次のつながりへ。','登録・検索・整理を、どの端末からでも。',btn('＋ 名刺を取り込む','scan','primary'))+`<div class="stats">${stat('登録済み','248','サンプル集計')}${stat('要確認','12','確認が必要')}${stat('重複候補','4','自動統合なし')}${stat('フォロー候補','7','ローカル提案')}</div><div class="banner"><div><strong>取り込み待ちの名刺を整理しましょう</strong><p>スキャンした名刺は確認後に登録できます。</p></div>${btn('確認画面を開く','review','primary')}</div><div class="grid2"><div class="card"><div class="card-head"><h2>最近登録した人物</h2><button class="list-btn" data-page="people">一覧を見る →</button></div>${state.people.slice(0,4).map(rowperson).join('')}</div><div class="card"><div class="card-head"><h2>次のアクション</h2><span class="pill gray">端末内の提案</span></div><div class="stack"><div class="row between"><div><strong>資料送付の確認</strong><div class="meta">佐藤 健二 ・ クラウド勉強会</div></div>${btn('開く','person')}</div><hr class="line"><div class="row between"><div><strong>重複候補を整理</strong><div class="meta">同一人物と思われる4件</div></div>${btn('確認','duplicates')}</div><hr class="line"><div class="row between"><div><strong>端末間の同期</strong><div class="meta">暗号化同期の画面デモ</div></div>${btn('確認','sync')}</div></div></div></div>`;}
function people(){let list=state.people.filter(p=>(p.name+p.company+p.event+p.memo+p.tags.join(' ')).toLowerCase().includes(state.search.toLowerCase()));if(state.filter==='要確認')list=list.filter(p=>p.status==='要確認');let p=state.people.find(x=>x.id===state.selected)||state.people[0];return title('名刺一覧','人物・会社・イベント・メモをまとめて検索できます。',btn('＋ 新規取り込み','scan','primary'))+`<div class="searchpanel"><label class="sr-only" for="search">人物を検索</label><input id="search" class="input" style="flex:1" placeholder="氏名・会社・イベントで検索" value="${e(state.search)}" /><select id="filter" class="select" style="width:137px" aria-label="確認状態で絞り込み"><option ${state.filter==='すべて'?'selected':''}>すべて</option><option ${state.filter==='要確認'?'selected':''}>要確認</option></select></div><div class="directory"><div class="card records"><div style="padding:15px 18px;border-bottom:1px solid var(--line)"><strong>検索結果 ${list.length}件</strong> <span class="quiet">/ デモデータ</span></div>${list.length?list.map(p=>`<div class="record ${p.id===state.selected?'active':''}" data-select="${p.id}">${avatar(p)}<div class="grow"><div class="pname">${e(p.name)}</div><div class="meta">${e(p.company)}</div><small>${e(p.event)}</small></div>${p.status==='要確認'?'<span class="pill warn">要確認</span>':''}</div>`).join(''):'<div class="empty">該当する人物はありません。検索条件を変更してください。</div>'}</div><div class="card">${personDetail(p,true)}</div></div>`;}
function personDetail(p,embed=false){return `<div class="detailhead">${avatar(p)}<div><div class="person-title">${e(p.name)}</div><div class="meta">${e(p.company)}</div></div></div><div class="actions">${btn('出会いメモ','person')}${btn('文案を作る','ai','primary')}</div><hr class="line"><h2>連絡先</h2><dl>${[['所属',p.company],['役職',p.job],['メール',p.email],['電話',p.phone],['最終交換日',p.date]].map(v=>`<div class="data-row"><dt>${v[0]}</dt><dd>${e(v[1])}</dd></div>`).join('')}</dl><hr class="line"><h2>名刺原本（架空の表示）</h2>${cardImage(p)}<hr class="line"><h2>出会いの記録</h2><p class="quiet">${e(p.event)} ・ ${e(p.date)}</p><p style="margin-top:9px">${e(p.memo)}</p><div class="actions" style="margin-top:15px">${p.tags.map(t=>`<span class="pill">${e(t)}</span>`).join('')}</div>${embed?'':`<div style="margin-top:18px">${btn('一覧へ戻る','people')}</div>`}`;}
function person(){return title('人物詳細','名刺と会った経緯を一緒に残します。')+`<div class="card" style="max-width:780px">${personDetail(state.people.find(p=>p.id===state.selected)||state.people[0])}<hr class="line"><h2>出会いメモを編集（デモ）</h2><div class="field"><label for="memo">会話メモ</label><textarea id="memo" class="textarea">${e(state.people.find(p=>p.id===state.selected)?.memo||'')}</textarea></div><button class="btn primary" data-action="savememo">デモとして保存</button></div>`;}
function scan(){return title('名刺を取り込む','iPhoneは連続撮影、PCでは画像やPDFを選択します。')+`<div class="grid2"><div class="card"><div class="scanarea"><div class="big-icon">▣</div><strong>名刺をここに追加</strong><p class="quiet">この画面はUIデモです。実際のカメラ・OCR処理は行いません。</p><div class="actions" style="justify-content:center;margin-top:11px"><button class="btn primary" data-action="addscan">撮影した想定で1枚追加</button><label class="btn" style="cursor:pointer">ファイルを選択<input id="fake-upload" type="file" accept="image/*,.pdf" multiple style="display:none"></label></div></div><div class="row between" style="margin-top:16px"><span class="quiet">デモのキュー: ${state.queue}枚</span>${btn('取り込みキューへ','queue','primary')}</div></div><div class="card"><h2>取り込みの手順</h2><div class="stack"><p><strong>01.</strong> 名刺を連続で撮影・選択</p><p><strong>02.</strong> 端末上で文字認識</p><p><strong>03.</strong> 氏名・会社などを確認</p><p><strong>04.</strong> 暗号化して保存</p></div><div class="notice" style="margin-top:22px">実アプリでは写真やPDFを外部AIへ自動アップロードしません。PCブラウザOCRは方式選定と実測が必要です。</div></div></div>`;}
function queue(){return title('取り込みキュー','途中で閉じても続きから再開できる設計です。',btn('文字認識結果を確認','review','primary'))+`<div class="card" style="max-width:880px"><div class="row between"><strong>${state.queue}件の名刺</strong><span class="pill warn">デモ処理中</span></div><div class="progress"><i style="width:${Math.min(100,Math.round(state.done/state.queue*100))}%"></i></div><p class="meta">${state.done}/${state.queue} 完了（表示のみ）</p>${Array.from({length:state.queue},(_,i)=>`<div class="queueitem"><div class="miniavatar">${i+1}</div><div style="flex:1"><strong>名刺 ${String(i+1).padStart(2,'0')}</strong><div class="meta">${i<state.done?'認識済み・要確認':'認識待ち'}</div></div><span class="pill ${i<state.done?'warn':'gray'}">${i<state.done?'要確認':'待機中'}</span></div>`).join('')}<div class="actions" style="margin-top:17px"><button class="btn" data-action="finishqueue">デモの処理を完了</button>${btn('確認画面へ','review','primary')}</div></div>`;}
function review(){return title('OCR確認・修正','元の名刺画像と抽出値を照合し、誤認識を修正します。')+`<div class="review"><div class="card"><h2>名刺画像（架空の見本）</h2>${cardImage({...state.people[1],name:state.review.name,company:state.review.company,email:state.review.email})}<div class="notice" style="margin-top:16px">文字認識の信頼度が低い項目は必ず確認してください。</div></div><div class="card"><div class="row between"><h2>認識結果を編集</h2><span class="pill warn">要確認</span></div>${[['name','氏名'],['company','会社名'],['job','役職'],['email','メールアドレス']].map(([id,l],i)=>`<div class="field"><label for="f-${id}">${l} ${i<2?'<span style="color:#ae4e33">*</span>':''}</label><input class="input" id="f-${id}" data-review="${id}" value="${e(state.review[id]||'')}" />${i===0?'<div class="helper">低確信度の例（デモ）</div>':''}</div>`).join('')}<div class="actions" style="margin-top:18px"><button class="btn primary" data-action="savereview">確認して登録（デモ）</button>${btn('重複候補を確認','duplicates')}</div></div></div>`;}
function duplicates(){let p=state.people[0];return title('重複候補を確認','自動統合せず、比較してから判断します。')+`<div class="comparison"><div class="card"><span class="pill gray">保存済み人物</span><h2 style="margin-top:14px">${e(p.name)}</h2>${cardImage(p)}<dl>${[['会社',p.company],['メール',p.email],['交換日',p.date]].map(([a,b])=>`<div class="data-row"><dt>${a}</dt><dd>${e(b)}</dd></div>`).join('')}</dl></div><div class="card"><span class="pill warn">新しい名刺候補</span><h2 style="margin-top:14px">山田 花子</h2>${cardImage({...p,company:'青葉ネットワーク株式会社'})}<dl>${[['会社',p.company],['メール',p.email],['交換日','2026/10/20']].map(([a,b])=>`<div class="data-row"><dt>${a}</dt><dd>${e(b)}</dd></div>`).join('')}</dl></div></div><div class="card" style="margin-top:16px"><strong>候補になった理由</strong><p class="subtitle">メールアドレスの一致。誤統合を防ぐため、人が判断します。</p><div class="actions" style="margin-top:14px"><button class="btn primary" data-action="dupmerge">同じ人物として追加（デモ）</button><button class="btn" data-action="dupseparate">別の人物として保存（デモ）</button>${btn('後で確認','home')}</div></div>`;}
function ai(){return title('AIアシスタント','まず端末内の名刺だけから検索・提案します。')+`<div class="grid2"><div class="card"><div class="row between" style="margin-bottom:14px"><h2 style="margin:0">名刺について質問</h2><span class="pill">ローカル検索</span></div><div class="promptchips"><button data-suggestion="九州IT交流会で会った人">九州IT交流会で会った人</button><button data-suggestion="佐藤さんへのお礼文案">佐藤さんへのお礼文案</button><button data-suggestion="クラウド関係の担当者">クラウド関係の担当者</button></div><div class="chat" id="chat">${state.chat.length?state.chat.map(m=>`<div class="msg ${m.role}">${e(m.text)}</div>`).join(''):`<div class="msg ai">名前を覚えていなくても、交換したイベントや会話メモから探せます。これは架空データを使った操作デモです。</div>`}</div><div class="composer"><input class="input" id="ai-input" placeholder="例：九州IT交流会で会った人" value="${e(state.aiText)}" /><button class="btn primary" data-action="ask">検索</button></div></div><div class="card"><h2>できること</h2><div class="stack"><p><strong>人物を探す</strong><br><span class="meta">イベント、企業名、会話メモから検索</span></p><hr class="line"><p><strong>連絡の下書きを作成</strong><br><span class="meta">元データを参照し、下書きのみ提示</span></p><hr class="line"><p><strong>外部AIに頼む場合</strong><br><span class="meta">必要項目を確認し、1回限り承認</span></p></div><button style="margin-top:22px" class="btn" data-page="approve">外部AI承認画面を見る</button></div></div>`;}
function approve(){return title('外部AIに送信する情報の確認','実アプリは送信前に情報の範囲・目的・宛先を提示します。')+`<div class="card" style="max-width:780px"><div class="notice"><strong>この画面はデモです。</strong><br>外部AIへの通信は行いません。実装ではユーザーの明示承認が必要です。</div><div class="approvegrid" style="margin:22px 0"><div>目的</div><strong>お礼メールの下書きを作る</strong><div>送信先</div><strong>外部LLM（実装後に明記）</strong><div>対象人数</div><strong>1名</strong><div>保持条件</div><strong>正式に採用する提供元・契約条件を確認して表示</strong></div><hr class="line"><h2>送信する項目</h2><label class="checkboxline"><input type="checkbox" checked disabled> 名字・氏名</label><label class="checkboxline"><input type="checkbox" checked disabled> 会社名・役職</label><label class="checkboxline"><input type="checkbox" checked disabled> イベント名（出会った経緯）</label><label class="checkboxline"><input type="checkbox" disabled> メールアドレス（送信対象外）</label><label class="checkboxline"><input type="checkbox" disabled> 電話番号（送信対象外）</label><div class="actions" style="margin-top:20px">${btn('キャンセル','ai')}<button class="btn primary" data-action="approve">この1回だけ許可（デモ）</button></div></div>`;}
function sync(){return title('端末間の暗号化同期','iPhone・Android・PCを同じ保管庫につなぐ設計です。')+`<div class="grid2"><div class="card"><div class="row between"><h2 style="margin:0">この端末の状態</h2><span class="pill gray">デモ表示</span></div><div style="padding:23px 0 14px;text-align:center"><div style="display:flex;justify-content:center;color:#315f97">${icon('cloud')}</div><strong style="display:block;font-size:19px;margin-top:11px">暗号化同期の画面プレビュー</strong><p class="meta" style="margin-top:5px">現在この試作HTMLからは通信していません</p></div><div class="actions">${btn('競合の確認','conflicts')}${btn('セキュリティ設定','settings')}</div></div><div class="card"><h2>登録端末（架空）</h2><div class="settingsitem"><div><strong>iPhone</strong><p class="meta">端末内鍵保護 / 外出先で撮影</p></div><span class="pill">想定</span></div><div class="settingsitem"><div><strong>Windows PC</strong><p class="meta">WebCrypto / ブラウザで整理</p></div><span class="pill">想定</span></div><div class="notice" style="margin-top:17px">本番では復旧キーなしに新端末が既存の名刺を復号できない仕組みを実装します。</div></div></div>`;}
function conflicts(){return title('同期の競合を確認','両端末で同じ項目を変更した場合、自動上書きを避けます。')+`<div class="comparison"><div class="card"><span class="pill gray">iPhoneで編集</span><h2 style="margin-top:12px">佐藤 健二</h2><p><strong>メモ:</strong> 資料を来週送る</p><p class="meta" style="margin-top:12px">2026/10/20 10:10</p></div><div class="card"><span class="pill warn">PCで編集</span><h2 style="margin-top:12px">佐藤 健二</h2><p><strong>メモ:</strong> 新しい案件について質問する</p><p class="meta" style="margin-top:12px">2026/10/20 10:12</p></div></div><div class="card" style="margin-top:16px"><p>どちらも失わないよう、内容を比較した上で保存します。</p><div class="actions" style="margin-top:15px"><button class="btn primary" data-action="resolve">両方のメモを残す（デモ）</button>${btn('後で','sync')}</div></div>`;}
function settings(){return title('設定とセキュリティ','保管庫とAIによる情報利用を細かく制御します。')+`<div class="sec-row"><div class="card"><h2>プライバシー</h2><div class="settingsitem"><div><strong>外部AIの利用</strong><p class="meta">実アプリでは初期OFF、毎回送信承認</p></div><button class="toggle ${state.external?'active':''}" role="switch" aria-checked="${state.external}" aria-label="外部AIの利用 デモ" data-action="toggleai"></button></div><div class="settingsitem"><div><strong>アプリロック</strong><p class="meta">Face IDや安全な復旧キー</p></div><span class="pill">必須設計</span></div><div class="settingsitem"><div><strong>復旧キー</strong><p class="meta">紛失するとデータを復旧できない場合があります</p></div>${btn('確認','recover')}</div><div class="settingsitem"><div><strong>データを書き出す</strong><p class="meta">再認証が必要</p></div>${btn('確認','export')}</div></div><div class="card"><h2>管理</h2><div class="settingsitem"><div><strong>端末間同期</strong><p class="meta">暗号文だけをクラウドに保存</p></div>${btn('管理','sync')}</div><div class="settingsitem"><div><strong>操作履歴</strong><p class="meta">送信・承認・削除などの記録</p></div>${btn('見る','audit')}</div><div class="settingsitem"><div><strong>ロック解除テスト</strong><p class="meta">画面上だけの動作デモ</p></div>${btn('開く','unlock')}</div><div class="notice" style="margin-top:17px">本プロトタイプは動作UIの検討用です。デモの切替は暗号化やAI通信を有効にしません。</div></div></div>`;}
function audit(){return title('操作履歴','氏名や名刺原文をログに記録しない設計です。')+`<div class="card" style="max-width:850px">${[['10/21 15:22','名刺登録','1件','成功'],['10/21 14:08','ローカル検索','4件','成功'],['10/20 19:31','AI送信承認','1件','拒否'],['10/20 19:10','重複候補を確認','2件','成功']].map(x=>`<div class="activity"><div class="row between"><strong>${x[1]}</strong><span class="pill gray">${x[3]}</span></div><div class="meta">${x[0]} ・ ${x[2]} ・ 架空ログ</div></div>`).join('')}</div>`;}
function exportview(){return title('データを書き出す','個人情報を含むため、暗号化バックアップを推奨します。')+`<div class="card" style="max-width:700px"><div class="notice">CSVなどの平文書き出しは漏えいリスクがあります。実装時は再認証・範囲確認・監査記録を必須にします。</div><div class="field"><label for="exptype">書き出し形式</label><select id="exptype" class="select"><option>暗号化バックアップ（推奨）</option><option>CSV（再認証が必要）</option></select></div><div class="field"><label for="expcount">対象件数</label><input id="expcount" class="input" value="248件（デモ）" readonly /></div><div class="actions"><button class="btn primary" data-action="export">書き出し確認（デモ）</button>${btn('設定に戻る','settings')}</div></div>`;}
function welcome(){return title('名刺管理を始める','名刺データは機微性のある連絡先情報です。')+`<div class="card" style="max-width:720px"><h2>まず保管庫を準備します</h2><p>アカウント認証と、名刺を復号する秘密鍵は別に管理します。</p><div class="notice" style="margin-top:16px">勤務先の名刺を登録する場合は、情報持ち出し・クラウド利用規程を確認してください。</div><div class="actions" style="margin-top:20px">${btn('保管庫を作る','recover','primary')}${btn('既存データを開く','unlock')}</div></div>`;}
function recover(){return title('復旧キーの管理','端末が使えなくなった際に必要な重要情報です。')+`<div class="card" style="max-width:720px"><div class="notice">本番では高エントロピーの復旧キーを生成・表示し、保管確認を行います。デモでは実際の鍵を作りません。</div><div style="background:#f4f7fb;padding:16px;border:1px dashed #cbd9e8;border-radius:10px;margin:17px 0;text-align:center;font-weight:700;color:#5f7591">実際の復旧キーはこの画面に表示しません</div><label class="checkboxline"><input type="checkbox" id="understand"> 復旧キーの安全な保管が必要と理解した（デモ）</label><div class="actions" style="margin-top:17px">${btn('ホームに戻る','home','primary')}${btn('設定へ','settings')}</div></div>`;}
function unlock(){return title('保管庫をロック解除','本番では認証に成功するまで名刺を表示しません。')+`<div class="card" style="max-width:520px"><div style="display:flex;justify-content:center;color:#356294;margin:10px 0 16px">${icon('lock')}</div><div class="field"><label for="keyphrase">復旧キー（デモ入力欄）</label><input class="input" id="keyphrase" type="password" autocomplete="off" placeholder="このデモには入力不要です" /></div><div class="notice" style="margin:17px 0">このページはUI検証用であり、本物の秘密鍵・パスワードを入力しないでください。</div>${btn('ロック解除操作を模擬','home','primary')}</div>`;}
function getPage(){switch(state.page){case 'home':return home();case 'people':return people();case 'person':return person();case 'scan':return scan();case 'queue':return queue();case 'review':return review();case 'duplicates':return duplicates();case 'ai':return ai();case 'approve':return approve();case 'sync':return sync();case 'conflicts':return conflicts();case 'settings':return settings();case 'audit':return audit();case 'export':return exportview();case 'welcome':return welcome();case 'recover':return recover();case 'unlock':return unlock();default:return home()}}
function toast(t){document.getElementById('toast')?.remove();let n=document.createElement('div');n.className='toast';n.id='toast';n.textContent=t;document.body.appendChild(n);setTimeout(()=>n.remove(),3000);}
function navigate(page){state.page=page;render();window.scrollTo({top:0,behavior:'instant'});}
function render(){const nav=mainNav.map(([p,ic,label])=>`<button ${p===state.page?'class="active"':''} data-page="${p}">${icon(ic)}<span>${label}</span>${p==='people'?'<span class="count">12</span>':''}</button>`).join('');document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="brandmark">C</div><div><b>Contact Vault</b><small>名刺管理 / DEMO</small></div></div><div class="nav"><div class="section-label">ワークスペース</div>${nav}<div class="section-label">管理</div><button data-page="sync">${icon('cloud')}<span>同期</span></button><button data-page="audit">${icon('shield')}<span>操作履歴</span></button></div><div class="asidefoot"><div>${icon('shield')} <strong>セキュア設計の試作</strong></div><div>架空データのみ。暗号化、OCR、同期、AI通信は未実装。</div><button data-page="welcome">初期設定画面を確認</button></div></aside><div class="content"><div class="topbar"><div class="left"><span style="color:#284e79">${icon('shield')}</span><span>${route[state.page]||'名刺管理'}</span><span class="demo-tag">操作デモ</span></div><div class="topright"><span class="hide-mobile">通信・保存は実行しません</span><button class="btn" data-page="sync" style="font-size:12px;padding:6px 10px;min-height:30px">同期画面</button><div class="avatar">CV</div></div></div><main class="main" id="screen">${getPage()}</main></div></div><nav class="mobilebar" aria-label="主要画面">${mainNav.map(([p,ic,label])=>`<button class="${p===state.page?'active':''} ${p==='scan'?'scanbtn':''}" data-page="${p}">${icon(ic)}<span>${label}</span></button>`).join('')}</nav>`;}
document.addEventListener('click',ev=>{const target=ev.target.closest('[data-page],[data-action],[data-person],[data-select],[data-suggestion]');if(!target)return;if(target.dataset.page){navigate(target.dataset.page);return;}if(target.dataset.person){state.selected=target.dataset.person;navigate('person');return;}if(target.dataset.select){state.selected=target.dataset.select;render();return;}if(target.dataset.suggestion){state.aiText=target.dataset.suggestion;render();return;}const action=target.dataset.action;if(action==='addscan'){state.queue++;toast('デモの取り込み件数に1枚追加しました');render();}else if(action==='finishqueue'){state.done=state.queue;render();toast('デモのキューを完了にしました');}else if(action==='savereview'){if(!state.review.name.trim()||!state.review.company.trim()){toast('氏名と会社名を入力してください');return;}state.people[1].name=state.review.name;state.people[1].company=state.review.company;state.people[1].job=state.review.job;state.people[1].email=state.review.email;state.people[1].status='確認済み';toast('デモの名刺情報を更新しました（永続化なし）');navigate('people');}else if(action==='savememo'){state.people.find(p=>p.id===state.selected).memo=document.getElementById('memo').value;toast('デモのメモを編集しました（永続化なし）');}else if(action==='dupmerge'||action==='dupseparate'){toast('比較操作を模擬しました。実データの統合はしていません。');navigate('people');}else if(action==='ask'){let q=document.getElementById('ai-input')?.value?.trim()||state.aiText.trim();if(!q)return toast('質問を入力してください');state.chat.push({role:'user',text:q});let hits=state.people.filter(p=>(p.name+p.company+p.event+p.tags.join(' ')+p.memo).includes(q.replace('で会った人','').replace('関係の担当者','').replace('へのお礼文案','')));state.chat.push({role:'ai',text:hits.length?`ローカル検索の例：${hits.map(p=>p.name+'（'+p.company+'）').join('、')}。参照元は名刺一覧です。`:'ローカル検索では候補を特定できませんでした。別の会社名・イベント名で試してください。'});state.aiText='';render();}else if(action==='approve'){state.approved=true;toast('承認操作のUIデモです。外部への送信はしていません。');navigate('ai');}else if(action==='toggleai'){state.external=!state.external;render();toast('デモの表示だけ変更しました。外部AIは実行されません。');}else if(action==='resolve'){toast('競合解決の操作を模擬しました');navigate('sync');}else if(action==='export'){toast('実際のエクスポートは行っていません。');}});
document.addEventListener('input',ev=>{if(ev.target.id==='search'){state.search=ev.target.value;let sel=ev.target.selectionStart;render();let next=document.getElementById('search');next.focus();next.setSelectionRange(sel,sel);}else if(ev.target.dataset.review){state.review[ev.target.dataset.review]=ev.target.value;}else if(ev.target.id==='ai-input'){state.aiText=ev.target.value;}});
document.addEventListener('change',ev=>{if(ev.target.id==='filter'){state.filter=ev.target.value;render();}if(ev.target.id==='fake-upload'){let n=ev.target.files?.length||0;if(n){state.queue+=n;toast(`${n}件を選択した想定でキューに追加（ファイルは処理しません）`);render();}}});
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.dataset.person){ev.preventDefault();state.selected=ev.target.dataset.person;navigate('person');}if(ev.key==='Enter'&&ev.target.id==='ai-input'){document.querySelector('[data-action="ask"]')?.click();}if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(ev.key==='/'){ev.preventDefault();navigate('people');document.getElementById('search')?.focus();}if(ev.key.toLowerCase()==='n'&&!ev.ctrlKey&&!ev.metaKey)navigate('scan');});
render();
</script>
</body>
</html>
