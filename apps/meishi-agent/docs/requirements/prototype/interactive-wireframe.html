<div class="app" id="app"></div>
<script>
/* This is an interaction-only demonstration. No user data is persisted or transmitted. */
const E=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I=(n)=>`<svg aria-hidden="true"><use href="#i-${n}"></use></svg>`;
const peopleSeed=[
{id:'c1',name:'佐藤 健一',initial:'佐',company:'株式会社東海ネットワーク',dept:'技術企画部',title:'部長',mail:'kenichi.sato@example.com',phone:'095-000-1024',date:'2026/10/18',event:'IT・ネットワーク交流会',memo:'自治体向けネットワーク更新の話。11月に事例共有予定。',tags:['ネットワーク','自治体'],follow:true,affiliation:'現職 2022年〜',class:'',state:'確認済み'},
{id:'c2',name:'山口 彩香',initial:'山',company:'グリーンテック合同会社',dept:'プロダクト推進室',title:'マネージャー',mail:'ayaka.yamaguchi@example.com',phone:'092-000-2261',date:'2026/10/16',event:'生成AI勉強会',memo:'業務AI導入とセキュリティ評価について情報交換。',tags:['生成AI','福岡'],follow:false,affiliation:'現職 2024年〜',class:'a2',state:'確認済み'},
{id:'c3',name:'高橋 直樹',initial:'高',company:'西日本クラウドサービス',dept:'クラウド基盤部',title:'エンジニア',mail:'naoki.takahashi@example.com',phone:'080-0000-8802',date:'2026/10/12',event:'Cloud Meetup',memo:'AWSのハイブリッド構成について議論。',tags:['AWS','クラウド'],follow:true,affiliation:'現職 2023年〜',class:'a3',state:'確認済み'},
{id:'c4',name:'中村 沙織',initial:'中',company:'株式会社アトリエデザイン',dept:'制作部',title:'ディレクター',mail:'saori.nakamura@example.com',phone:'090-0000-4519',date:'2026/10/09',event:'クリエイティブ交流会',memo:'UXリサーチのツールについて相談。',tags:['デザイン','UX'],follow:false,affiliation:'現職 2025年〜',class:'a4',state:'確認済み'},
{id:'c5',name:'田中 悠斗',initial:'田',company:'九州情報セキュリティ',dept:'営業推進',title:'担当',mail:'yuto.tanaka@example.com',phone:'095-000-7872',date:'2026/10/19',event:'セキュリティ展示会',memo:'ゼロトラストの製品資料をもらう。',tags:['セキュリティ'],follow:false,affiliation:'現職 2026年〜',class:'',state:'要確認'}
];
let persons=peopleSeed.map(x=>({...x,tags:[...x.tags]}));
let state={view:'home',sel:'c1',filter:'all',query:'',preview:false,scanCount:3,backFace:false,aiRemote:false,aiText:'',aiReplies:[],localDraft:'',tasks:[{id:1,title:'佐藤さんに事例共有の日程を連絡',contact:'c1',when:'10月24日',done:false},{id:2,title:'高橋さんにAWS構成資料を送る',contact:'c3',when:'10月26日',done:false},{id:3,title:'交流会の交換名刺を登録する',contact:null,when:'今日',done:false}],toggles:{ai:false,hide:true,lock:true,notice:true},selectedFields:['氏名','会社名','会話メモ'],audit:[['10/21 19:21','アプリのロック解除','許可'],['10/20 18:05','名刺データの修正','成功'],['10/18 11:30','外部AI送信を要求','拒否']],sort:'recent',approvedScan:false};
const titles={home:'ホーム',scan:'名刺スキャン',queue:'取り込みキュー',review:'OCR結果の確認',duplicates:'重複候補',people:'人物一覧',person:'人物詳細',edit:'人物情報の編集',ai:'AIアシスタント',tasks:'フォローアップ',draft:'連絡文の下書き',settings:'設定',security:'セキュリティ',sync:'端末同期',backup:'バックアップ',audit:'操作履歴',export:'データ書き出し',onboarding:'初期設定',unlock:'ロック解除'};
const mainNav=[['home','home','ホーム'],['people','users','人物一覧'],['scan','scan','名刺を登録'],['ai','ai','AIアシスタント'],['tasks','calendar','フォローアップ']];
const secondNav=[['queue','list','取り込みキュー'],['duplicates','refresh','重複候補'],['security','lock','セキュリティ'],['sync','cloud','端末同期'],['settings','setting','設定']];
function btn(t,act='home',cls=''){return `<button type="button" class="btn ${cls}" data-go="${act}">${t}</button>`}
function go(view){state.view=view;window.scrollTo({top:0,behavior:'instant'});render()}
function getP(){return persons.find(x=>x.id===state.sel)||persons[0]}
function av(p){return `<div class="avatar ${E(p.class||'')}">${E(p.initial||p.name[0])}</div>`}
function personRow(p){return `<div class="list-row action" data-person="${E(p.id)}">${av(p)}<div class="flex-1"><div class="name">${E(p.name)} ${p.state==='要確認'?'<span class="tag warn">要確認</span>':''}</div><div class="desc">${E(p.company)} · ${E(p.title)}</div><div class="desc">${E(p.event)} · ${E(p.date)}</div></div>${I('right')}</div>`}
function navBtn(n){return `<button class="nav-btn ${state.view===n[0]?'active':''}" data-go="${n[0]}">${I(n[1])}<span>${n[2]}</span>${n[0]==='duplicates'?'<span class="counter">6</span>':''}</button>`}
function header(title,sub='',actions='',parent=''){return `<div class="header"><div>${parent?`<button class="btn btn-ghost back" data-go="${parent}">${I('left')} 戻る</button>`:''}<div class="eyebrow">${E(parent?'管理・操作':'名刺管理')}</div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div>${actions?`<div class="header-acts">${actions}</div>`:''}</div>`}
function layout(body){let v=state.view;return `<aside class="sidebar"><div class="brand"><span class="brand-mark">${I('file')}</span><span>名刺管理<span class="subbrand">つながりを、安全に残す</span></span></div><div class="nav-group"><div class="nav-label">メインメニュー</div>${mainNav.map(navBtn).join('')}</div><div class="nav-group"><div class="nav-label">データと設定</div>${secondNav.map(navBtn).join('')}</div><div class="side-bottom"><div class="secure-status">${I('lock')} デモ表示 / データ送信なし</div><button class="nav-btn" style="margin-top:10px" data-go="onboarding">${I('file')} 初期設定を見る</button></div></aside><main class="main"><header class="topbar"><div class="crumb">名刺管理 <span style="color:#b1bbc0">/</span> ${E(titles[v]||'ホーム')}</div><div class="top-actions"><span class="pill"><i class="dot"></i> サンプルデータ</span><button class="btn btn-sm preview-btn" id="preview-toggle">${I('smartphone')} ${state.preview?'PC表示':'iPhone表示'}</button><button class="iconbtn" data-go="security" title="セキュリティ設定">${I('lock')}</button></div></header><div class="page" id="page">${body}</div><nav class="bottom-nav" aria-label="モバイルナビゲーション">${[['home','home','ホーム'],['people','users','人物'],['scan','scan','登録'],['ai','ai','AI'],['settings','setting','設定']].map(n=>`<button class="bottom-btn ${n[0]===v?'active':''}" data-go="${n[0]}">${I(n[1])}<span>${n[2]}</span></button>`).join('')}</nav></main>`}
function home(){return `${header('名刺を、使える情報に。','最近の登録状況と、次に確認することをまとめています。',btn(`${I('scan')} 名刺を取り込む`,'scan','btn-primary'))}<div class="grid cols-4" style="margin-bottom:20px"><div class="panel metric"><label>登録済み名刺</label><strong>428</strong><small>サンプル件数</small></div><div class="panel metric warning"><label>内容の確認待ち</label><strong>18</strong><small>修正すると検索精度が向上</small></div><div class="panel metric"><label>重複候補</label><strong>6</strong><small>統合は手動承認</small></div><div class="panel metric emphasis"><label>今週のフォロー予定</label><strong>${state.tasks.filter(t=>!t.done).length}</strong><small>確認する連絡先</small></div></div><div class="grid cols-3" style="margin-bottom:19px"><button class="quick" data-go="scan"><span class="quick-ic">${I('scan')}</span><span><strong>名刺をまとめて登録</strong><small>スマホのカメラで撮影</small></span></button><button class="quick" data-go="review"><span class="quick-ic">${I('edit')}</span><span><strong>認識結果を確認</strong><small>読み取りミスを修正</small></span></button><button class="quick" data-go="ai"><span class="quick-ic">${I('ai')}</span><span><strong>AIで人を探す</strong><small>出会った場面から検索</small></span></button></div><div class="split"><div class="panel section-pad"><div class="heading"><h2>最近登録した人</h2><button class="text-link" data-go="people">すべて見る →</button></div>${persons.slice(0,4).map(personRow).join('')}</div><div class="stack"><div class="panel section-pad"><div class="heading"><h2>確認しておきたいこと</h2></div><div class="list-row action" data-go="review"><span class="tag warn">18件</span><div class="flex-1"><div class="name">OCR結果に要確認項目があります</div><div class="desc">氏名やメールアドレスを確認してください</div></div>${I('right')}</div><div class="list-row action" data-go="duplicates"><span class="tag">6組</span><div class="flex-1"><div class="name">同じ人物の可能性がある名刺</div><div class="desc">誤統合を防ぐため比較してから確定</div></div>${I('right')}</div></div><div class="panel section-pad"><div class="heading"><h2>セキュリティ</h2><button class="text-link" data-go="security">設定を見る →</button></div><div class="alert">${I('lock')} 外部AIへの送信は初期設定で無効。送信が必要な際はデータ項目を表示し、毎回承認を求めます。</div></div></div></div>`}
function scan(){return `${header('名刺を取り込む','カメラで1枚ずつ撮影し、あとでまとめて確認できます。',btn('取り込みキューを見る','queue'), 'home')}<div class="scan-zone"><div class="panel section-pad"><div class="heading"><h2>カメラ撮影</h2><span class="tag good">端末内処理の設計</span></div><div class="camera"><div class="finder"><i class="cam-corner c1"></i><i class="cam-corner c2"></i><i class="cam-corner c3"></i><i class="cam-corner c4"></i></div></div><div class="scan-toolbar"><button class="btn btn-sm" id="face-switch">${state.backFace?'裏面を撮影中':'表面を撮影中'} · 切替</button><button class="shutter" id="shutter" title="デモ: 1枚追加" aria-label="サンプル名刺を1枚撮影"></button><span class="small muted">${state.scanCount}枚取り込み</span></div><p class="small muted" style="text-align:center;margin:4px 0 12px">ワイヤーフレームのため、撮影ボタンはサンプルキューへの追加操作です。</p><label class="btn btn-block" style="cursor:pointer">${I('plus')} 画像ファイルを選択（デモ）<input id="image-import" type="file" accept="image/*" multiple hidden /></label><div style="margin-top:12px">${btn(`OCR結果を確認する →`,'queue','btn-primary btn-block')}</div></div><div class="alert" style="margin-top:14px">実装時は撮影画像・サムネイルを端末の非公開領域に暗号化保存します。デモでは画像を保存・送信しません。</div></div>`}
function queue(){let items=[['名刺 #001','氏名・会社名を認識済み','good'],['名刺 #002','メールアドレスの確認が必要','warn'],['名刺 #003','文字の一部が読み取れません','warn']];return `${header('取り込みキュー','取り込みを中断しても、確定前のデータを確認できる設計です。',btn(`${I('scan')} 追加撮影`,'scan'), 'scan')}<div class="panel section-pad"><div class="heading"><h2>取り込み状況</h2><span class="tag">${state.scanCount}枚</span></div><div class="alert">処理ステータス：${Math.max(0,state.scanCount-2)}枚は確認対象です。失敗した名刺は再撮影できます。</div>${Array.from({length:Math.min(state.scanCount,8)},(_,i)=>{let x=items[i%3];return `<div class="queue-item"><div class="queue-thumb">名刺 #${String(i+1).padStart(3,'0')}</div><div class="flex-1"><div class="name">${x[0].replace(/\d+$/,String(i+1).padStart(3,'0'))}</div><div class="desc">${x[1]}</div></div><span class="tag ${x[2]}">${x[2]==='good'?'認識済み':'要確認'}</span></div>`}).join('')}<div style="margin-top:17px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">${btn('撮影に戻る','scan')}${btn('1件ずつ確認する →','review','btn-primary')}</div></div>`}
const reviewFields=[['氏名','name'],['会社名','company'],['部署','dept'],['役職','title'],['メール','mail'],['電話','phone']];
function bizCard(p){return `<div class="businesscard"><div><div class="bizcorp">${E(p.company)}</div><div class="bizpos">${E(p.dept)} / ${E(p.title)}</div></div><div><div class="bizname">${E(p.name)}</div><div class="bizfine">${E(p.mail)}<br>${E(p.phone)}</div></div></div>`}
function review(){let p=getP();return `${header('読み取り結果を確認','保存前に原本と読み取り結果を照合してください。','', 'queue')}<div class="review-layout"><div class="panel section-pad sticky-panel"><div class="heading"><h2>名刺の原本（サンプル）</h2><span class="tag">表面</span></div>${bizCard(p)}<p class="mini muted" style="margin-top:15px">実装時は撮影画像をここに表示。タップで拡大・裏面切替。</p></div><div class="panel section-pad"><div class="heading"><h2>自動認識された項目</h2><span class="tag warn">一部確認が必要</span></div><form id="review-form"><div class="form-grid">${reviewFields.map(([label,key],i)=>`<div class="field"><label for="rev-${key}">${label} ${key==='mail'?'<span class="tag warn">要確認</span>':''}</label><input class="input" id="rev-${key}" name="${key}" value="${E(p[key])}" autocomplete="off" /></div>`).join('')}</div><div class="alert warn">名前・メールなどの重要項目は、OCRが推測した値を無条件で確定しません。保存前に人が確認します。</div><div class="review-actions"><button type="button" class="btn" data-go="queue">保留する</button><button type="submit" class="btn btn-primary">${I('check')} 内容を確認して保存</button></div></form></div></div>`}
function duplicates(){let a=persons[0],b={...persons[0],name:'佐藤 健一',company:'株式会社東海ネットワーク',dept:'DX推進部',title:'次長',date:'2024/05/17',mail:'k.sato@example.com'};return `${header('重複名刺を確認','似ている情報でも、別人や過去の所属の可能性があります。','', 'home')}<div class="alert warn" style="margin-bottom:16px">自動統合は行いません。異動・転職による複数名刺は履歴として残せます。</div><div class="comparison"><div class="panel section-pad"><div class="heading"><h2>登録済みの名刺</h2><span class="tag good">2026年</span></div>${bizCard(a)}<div style="margin-top:15px">${[['氏名',a.name],['会社',a.company],['部署・役職',a.dept+' / '+a.title],['メール',a.mail]].map(([k,v])=>`<div class="diffrow"><label>${k}</label><span>${E(v)}</span></div>`).join('')}</div></div><div class="panel section-pad"><div class="heading"><h2>重複候補</h2><span class="tag warn">2024年</span></div>${bizCard(b)}<div style="margin-top:15px">${[['氏名',b.name],['会社',b.company],['部署・役職',b.dept+' / '+b.title],['メール',b.mail]].map(([k,v])=>`<div class="diffrow"><label>${k}</label><span>${E(v)}</span></div>`).join('')}</div></div></div><div class="panel section-pad" style="margin-top:17px"><div class="heading"><h2>どのように扱いますか？</h2></div><p class="small muted">同一人物として履歴に追加するか、別人として保持するかを選んでください。判断できない場合は保留できます。</p><div class="header-acts"> <button class="btn btn-primary" data-modal="merge">同一人物として履歴に追加</button><button class="btn" data-modal="separate">別人として保持</button>${btn('保留する','people','btn-ghost')}</div></div>`}
function listItems(){let rows=persons.filter(p=>{let q=state.query.toLowerCase();let isQ=!q||[p.name,p.company,p.dept,p.title,p.event,p.memo,...p.tags].some(x=>x.toLowerCase().includes(q));return isQ && (state.filter==='all'||(state.filter==='review'?p.state==='要確認':p.tags.includes(state.filter)))});return rows}
function ppl(){let rows=listItems();return `${header('人物一覧','名刺の名前が分からなくても、イベントや会話メモから探せます。',btn(`${I('plus')} 名刺を登録`,'scan','btn-primary'))}<div class="panel section-pad" style="margin-bottom:16px"><div class="search">${I('search')}<input id="person-search" type="search" placeholder="名前・会社・イベント・会話メモで検索" value="${E(state.query)}" /></div><div class="chip-row" style="margin-top:12px">${[['all','すべて'],['review','要確認'],['AWS','AWS'],['生成AI','生成AI'],['ネットワーク','ネットワーク'],['セキュリティ','セキュリティ']].map(([id,t])=>`<button class="chip ${state.filter===id?'active':''}" data-filter="${id}">${t}</button>`).join('')}</div></div><div class="person-layout"><div class="panel person-list" id="people-results">${rows.length?rows.map(p=>`<div class="person-item ${p.id===state.sel?'active':''}" data-person="${p.id}">${av(p)}<div class="flex-1"><div class="name">${E(p.name)} ${p.state==='要確認'?'<span class="tag warn">要確認</span>':''}</div><div class="desc">${E(p.company)}</div><div class="desc">${E(p.title)} / ${E(p.date)}</div></div>${I('right')}</div>`).join(''):'<div class="empty">条件に合う人物が見つかりません。<br>検索語やフィルターを変更してください。</div>'}</div><div class="detail-in-list">${detailContent(getP(),true)}</div></div>`}
function detailContent(p,compact=false){return `<div class="panel detail-card"><div class="identity">${av(p)}<div class="flex-1"><h2>${E(p.name)}</h2><p>${E(p.company)} · ${E(p.title)}</p><span class="tag good">${E(p.state)}</span></div></div><div class="header-acts" style="margin:18px 0 23px">${btn(`${I('edit')} 編集`,'edit')}${btn(`${I('ai')} 文案作成`,'draft','btn-primary')}</div><div class="heading"><h2>連絡先</h2></div><dl class="info-list"><dt>会社</dt><dd>${E(p.company)}</dd><dt>部署・役職</dt><dd>${E(p.dept)} / ${E(p.title)}</dd><dt>メール</dt><dd>${E(p.mail)}</dd><dt>電話</dt><dd>${E(p.phone)}</dd></dl><div style="border-top:1px solid var(--line);margin:23px 0 18px"></div><div class="heading"><h2>出会った経緯</h2><span class="tag">${E(p.date)}</span></div><div class="timeline"><div class="timeline-item"><div class="name">${E(p.event)}</div><div class="desc">${E(p.memo)}</div></div><div class="timeline-item"><div class="name">所属履歴</div><div class="desc">${E(p.affiliation)}</div></div></div><div class="heading"><h2>タグ</h2></div><div class="chip-row">${p.tags.map(t=>`<span class="tag">${E(t)}</span>`).join('')}</div></div>`}
function person(){let p=getP();return `${header(p.name,p.company,btn('他の人物を探す','people'), 'people')}${detailContent(p)}<div class="grid cols-2" style="margin-top:16px"><div class="panel section-pad"><div class="heading"><h2>名刺原本</h2></div>${bizCard(p)}<p class="mini muted">デモ用の架空名刺です。実装時は暗号化保存された原本を表示します。</p></div><div class="panel section-pad"><div class="heading"><h2>次のアクション</h2></div><div class="alert">${p.follow?'フォローアップ候補に登録されています。':'連絡文の下書きからフォローアップを作成できます。'}</div><div style="margin-top:16px">${btn(`${I('calendar')} フォローアップを見る`,'tasks','btn-block')}</div></div></div>`}
function edit(){let p=getP();return `${header('人物情報を編集','手動で訂正した内容はOCRの元データと区別して管理します。','', 'person')}<div class="panel section-pad" style="max-width:760px"><form id="edit-form"><div class="form-grid">${reviewFields.map(([label,key])=>`<div class="field"><label>${label}</label><input class="input" name="${key}" value="${E(p[key])}" /></div>`).join('')}</div><div class="field"><label>会話メモ</label><textarea class="textarea" name="memo">${E(p.memo)}</textarea></div><div class="field"><label>イベント名</label><input class="input" name="event" value="${E(p.event)}" /></div><div class="review-actions"><button class="btn" type="button" data-go="person">変更を破棄</button><button type="submit" class="btn btn-primary">${I('check')} 保存</button></div></form></div>`}
function ai(){return `${header('AIアシスタント','名刺や会話メモを手がかりに、人物の検索や連絡準備を支援します。',btn('AIの利用設定','security'))}<div class="grid cols-2"><div class="panel section-pad"><div class="heading"><h2>何を手伝いましょうか？</h2><span class="tag good">ローカル検索</span></div><div class="chip-row" style="margin-bottom:17px"><button class="chip" data-ai-prompt="先月のAI勉強会で会った人を探して">先月のAI勉強会で会った人</button><button class="chip" data-ai-prompt="AWSについて話した人を探して">AWSについて話した人</button><button class="chip" data-ai-prompt="佐藤さんへのお礼文を作って">お礼メールの下書き</button></div><div class="chat" id="chat-box"><div class="bubble ai">こんにちは。登録した名刺や交換時のメモから人物を探せます。<br><span class="cite-source">端末内データを参照する設計</span></div>${state.aiReplies.map(o=>`<div class="bubble me">${E(o.q)}</div><div class="bubble ai">${E(o.a)}<div class="cite-source">参照元：サンプル名刺・交換メモ</div></div>`).join('')}</div><form class="prompt-bar" id="ai-form"><textarea name="prompt" id="ai-prompt" aria-label="AIに相談" placeholder="例：展示会で会ったセキュリティ担当者" rows="1"></textarea><button class="btn btn-primary" type="submit">${I('send')} 検索</button></form><p class="mini muted" style="margin:11px 0 0">デモの応答はルールベースの固定例です。LLMや名刺DBには接続していません。</p></div><div class="stack"><div class="panel section-pad"><div class="heading"><h2>外部AIを使う場合</h2></div><p class="small muted">外部AIで文面を整える操作は、送信項目・処理先・目的の事前確認が必要です。</p><div class="alert warn">初期設定では外部AI送信を拒否。許可済みでも操作ごとの承認が必要です。</div><div style="margin-top:13px"><button class="btn btn-block" data-modal="ai-consent">${I('lock')} データ送信の承認画面を見る</button></div></div><div class="panel section-pad"><div class="heading"><h2>よく使う機能</h2></div><div class="list-row action" data-go="draft"><div class="quick-ic">${I('edit')}</div><div class="flex-1"><div class="name">お礼メールの文案</div><div class="desc">下書きのみ。自動送信しません</div></div>${I('right')}</div><div class="list-row action" data-go="people"><div class="quick-ic">${I('search')}</div><div class="flex-1"><div class="name">条件を指定した人物検索</div><div class="desc">参照したカードを確認できます</div></div>${I('right')}</div></div></div></div>`}
function tasks(){return `${header('フォローアップ','誰に、いつ、何を連絡するかを整理します。',`<button type="button" class="btn btn-primary" id="add-task">${I('plus')} タスクを追加</button>`)}<div class="panel section-pad"><div class="heading"><h2>対応すること</h2><span class="tag">${state.tasks.filter(x=>!x.done).length}件</span></div>${state.tasks.map(t=>{let p=persons.find(x=>x.id===t.contact);return `<div class="list-row"><input type="checkbox" data-task="${t.id}" ${t.done?'checked':''} aria-label="${E(t.title)}を完了" style="width:18px;height:18px;accent-color:var(--primary)"/><div class="flex-1" style="${t.done?'text-decoration:line-through;opacity:.5':''}"><div class="name">${E(t.title)}</div><div class="desc">${p?E(p.name)+' · ':''}${E(t.when)}</div></div><span class="tag ${t.done?'good':''}">${t.done?'完了':'予定'}</span></div>`}).join('')}<div style="margin-top:15px">${btn('人物一覧から担当者を探す','people')}</div></div>`}
function draft(){let p=getP();let draft=state.localDraft||`${p.name}様\n\n先日は${p.event}でお話しする機会をいただき、ありがとうございました。\n${p.memo.includes('AWS')?'AWSの構成について、改めて情報交換できればと考えております。':'お話しいただいた内容について、ぜひ改めて情報交換できればと思っております。'}\n\n引き続きよろしくお願いいたします。`;return `${header('連絡文の下書き','送信は行いません。事実関係と宛先を確認してからご利用ください。','', 'person')}<div class="review-layout"><div class="panel section-pad"><div class="heading"><h2>参照する人物</h2></div>${personRow(p)}<div class="alert" style="margin-top:15px">この画面では登録済み情報からテンプレートを作っています。外部サービスには送信していません。</div></div><div class="panel section-pad"><div class="field"><label>件名</label><input class="input" value="【ご挨拶】${E(p.event)}での御礼" id="draft-subject" /></div><div class="field"><label>本文（編集可能）</label><textarea class="textarea" id="draft-body" style="min-height:230px">${E(draft)}</textarea></div><div class="header-acts"><button class="btn btn-primary" id="copy-draft">${I('copy')} 下書きをコピー</button><button class="btn" data-modal="ai-consent">外部AIで文面を調整</button></div><p class="mini muted">AIへの送信を承認しても、この試作版では実際の通信は発生しません。</p></div></div>`}
function settings(){return `${header('設定','名刺の保護、バックアップ、データ操作を管理します。')}<div class="grid cols-2">${[['security','lock','セキュリティ・プライバシー','AIの利用権限やロック設定'],['sync','cloud','端末同期','iPhoneとPC間の同期状態'],['backup','file','バックアップ・復元','暗号化バックアップの設計'],['audit','list','操作履歴','実行履歴・拒否された要求'],['export','send','データの書き出し','再認証の後で対象を確認'],['onboarding','setting','初期設定ガイド','セットアップ時の画面導線']].map(x=>`<button class="quick" data-go="${x[0]}"><span class="quick-ic">${I(x[1])}</span><span><strong>${x[2]}</strong><small>${x[3]}</small></span>${I('right')}</button>`).join('')}</div><div class="alert" style="margin-top:18px">この試作画面はすべて架空データで構成されています。暗号化・認証・同期は実装されていません。</div>`}
function settingRow(k,title,description){return `<div class="settings-row"><div class="flex-1"><h3>${title}</h3><p>${description}</p></div><button class="toggle ${state.toggles[k]?'on':''}" data-toggle="${k}" role="switch" aria-checked="${state.toggles[k]?'true':'false'}" aria-label="${title}"></button></div>`}
function security(){return `${header('セキュリティ・プライバシー','名刺情報とAIアクセスの境界を明確にします。','', 'settings')}<div class="alert warn" style="margin-bottom:17px">仕様上の設定画面です。試作版では設定の見た目だけ変更され、実際の暗号化・ロック・通信制御は行いません。</div><div class="grid cols-2"><div class="panel section-pad"><div class="heading"><h2>アクセス保護</h2></div>${settingRow('lock','操作時の再認証','一定時間無操作・機密操作の際に本人認証')}${settingRow('hide','アプリ切替時の画面保護','バックグラウンドの名刺プレビューを隠す')}${settingRow('notice','通知に氏名を表示しない','ロック画面への個人情報表示を抑制')}</div><div class="panel section-pad"><div class="heading"><h2>AIの権限</h2></div>${settingRow('ai','外部AIの利用を許可','利用開始後もリクエスト単位の事前確認は必須')}<div class="alert ${state.toggles.ai?'warn':''}" style="margin:10px 0 17px">外部AI：${state.toggles.ai?'許可済み（送信は毎回承認）':'無効（デフォルト）'}</div><button class="btn btn-block" data-modal="ai-consent">AI送信の確認画面を見る</button></div></div><div class="panel section-pad" style="margin-top:17px"><div class="heading"><h2>データの管理</h2></div><div class="grid cols-3"><button class="quick" data-go="sync"><span class="quick-ic">${I('cloud')}</span><span><strong>端末同期</strong><small>同期状況と追加端末</small></span></button><button class="quick" data-go="audit"><span class="quick-ic">${I('list')}</span><span><strong>操作履歴</strong><small>拒否された要求も記録</small></span></button><button class="quick" data-go="export"><span class="quick-ic">${I('send')}</span><span><strong>データの書き出し</strong><small>再認証必須</small></span></button></div></div>`}
function sync(){return `${header('端末同期','名刺は端末で暗号化し、クラウドには暗号文のみ保存する設計です。','', 'settings')}<div class="alert warn" style="margin-bottom:16px">画面は設計デモです。実際のE2EE同期・端末認証・鍵配布は未実装です。</div><div class="grid cols-2"><div class="panel section-pad"><div class="heading"><h2>利用する端末（想定）</h2></div><div class="list-row"><span class="quick-ic">${I('scan')}</span><div class="flex-1"><div class="name">iPhone</div><div class="desc">撮影・名刺登録・内容確認</div></div><span class="tag good">メイン端末</span></div><div class="list-row"><span class="quick-ic">${I('cloud')}</span><div class="flex-1"><div class="name">Windows / Mac</div><div class="desc">一覧・検索・一括整理</div></div><span class="tag">追加可能</span></div><div style="margin-top:17px"><button class="btn btn-primary btn-block" data-modal="pair">${I('plus')} PCを追加する手順を見る</button></div></div><div class="panel section-pad"><div class="heading"><h2>保護方式</h2></div><div class="stack"><div class="alert">① アカウント本人確認とは別に、端末内で復号鍵を保護します。</div><div class="alert">② 新端末の追加には既存端末での確認、または復旧キーを要求します。</div><div class="alert">③ サーバーは暗号化済みデータしか保存せず、端末で復号します。</div></div></div></div>`}
function backup(){return `${header('バックアップ・復元','端末紛失に備え、暗号化されたバックアップと復旧キーを管理します。','', 'settings')}<div class="grid cols-2"><div class="panel section-pad"><div class="heading"><h2>バックアップ</h2></div><p class="small muted">復元キーを紛失すると、サービス運営者も原則として名刺の中身を復旧できません。</p><div class="alert warn">復旧キーはバックアップと別の安全な場所に保管してください。</div><div style="margin-top:16px"><button class="btn btn-primary btn-block" data-modal="backup">暗号化バックアップの操作を見る</button></div></div><div class="panel section-pad"><div class="heading"><h2>復元</h2></div><p class="small muted">新しい端末で復旧キーを入力し、暗号化データを端末側で復号する想定です。</p><div class="field"><label>復旧キー</label><input class="input" placeholder="デモのため入力できません" disabled type="password" /></div><button class="btn btn-block" data-modal="restore">復元手順を見る</button></div></div>`}
function audit(){return `${header('操作履歴','機密操作・外部送信・拒否された操作を確認できます。','', 'settings')}<div class="panel section-pad"><div class="heading"><h2>最近の履歴</h2><span class="tag good">監査ログ例</span></div><div class="audit-row" style="font-weight:750"><span>日時</span><span>操作</span><span>結果</span></div>${state.audit.map(a=>`<div class="audit-row"><span class="muted">${E(a[0])}</span><span>${E(a[1])}</span><span class="tag ${a[2]==='拒否'?'warn':'good'}">${E(a[2])}</span></div>`).join('')}<p class="mini muted">実装時は原文の氏名・電話・メール・送信内容を監査ログに残さず、操作種別や対象ID等を保存します。</p></div>`}
function exportScreen(){return `${header('名刺データの書き出し','書き出し範囲を確認し、再認証した後で暗号化ファイルを作成します。','', 'settings')}<div class="panel section-pad" style="max-width:760px"><div class="field"><label>対象</label><select class="select"><option>選択した人物のみ（推奨）</option><option>すべての人物（再認証必須）</option></select></div><div class="field"><label>含める情報</label><label><input type="checkbox" checked /> 氏名・会社・部署・役職</label><label><input type="checkbox" checked /> 電話番号・メール</label><label><input type="checkbox" /> 交換メモ・原本画像</label></div><div class="alert warn">平文CSVは情報漏えいのリスクがあります。原則として暗号化バックアップ形式を推奨します。</div><div style="margin-top:16px"><button class="btn btn-primary" data-modal="export">${I('lock')} 本人確認へ進む</button></div></div>`}
function onboarding(){return `${header('初期設定ガイド','導入時には、名刺の保存場所・同期・復旧方法を確認します。','', 'settings')}<div class="grid cols-3"><div class="panel section-pad"><div class="eyebrow">STEP 1 / 3</div><h2 style="margin:0 0 8px;font-size:17px">端末を保護する</h2><p class="small muted">本人確認と自動ロックを有効にします。名刺の取り込みはローカルで開始できます。</p><span class="tag good">初期設定でON</span></div><div class="panel section-pad"><div class="eyebrow">STEP 2 / 3</div><h2 style="margin:0 0 8px;font-size:17px">同期を設定する</h2><p class="small muted">iPhoneとPCで同じ情報を扱う場合は、E2EE同期と復旧キー設定を行います。</p><button class="btn btn-sm" data-go="sync">同期画面を見る</button></div><div class="panel section-pad"><div class="eyebrow">STEP 3 / 3</div><h2 style="margin:0 0 8px;font-size:17px">名刺を登録する</h2><p class="small muted">取り込み後にOCR結果を確認し、誤認識を修正します。</p><button class="btn btn-primary btn-sm" data-go="scan">取り込みへ進む</button></div></div><div class="alert" style="margin-top:17px">会社の名刺を個人管理ツールに取り込む前に、所属組織の情報管理規程を確認してください。</div>`}
const views={home,scan,queue,review,duplicates,people:ppl,person,edit,ai,tasks,draft,settings,security,sync,backup,audit,export:exportScreen,onboarding,unlock:onboarding};
let modalName='';function modalHtml(name){const defs={
'enable-ai':{title:'外部AIの利用設定を変更',desc:'利用を許可しても、名刺情報は自動送信されません。AIを使うたびに、送信先と対象項目を確認して承認します。',content:'<div class="alert warn">試作版では設定表示だけを切り替えます。実際の外部通信はありません。</div>',confirm:'内容を理解してONにする（デモ）'},
'AI_CONSENT':{title:'外部AIへの送信を確認',desc:'下記の項目を外部サービスへ送る前に内容を確認します。これは画面上のデモであり、実際の通信は行いません。',content:`<div class="alert warn">外部AIの利用設定：${state.toggles.ai?'ON（毎回承認必須）':'OFF（送信不可）'}</div><div style="margin-top:13px" class="small"><strong>利用目的：</strong>お礼メールの文案調整<br><strong>送信先：</strong>本番実装時にプロバイダー名・処理地域を表示<br><strong>対象：</strong>${E(getP().name)}の選択フィールド</div><div style="margin-top:13px"><strong class="small">送信する項目を選択</strong>${['氏名','会社名','会話メモ','メールアドレス'].map(x=>`<label style="display:block;margin:8px 0;font-size:12px"><input type="checkbox" class="consent-field" value="${x}" ${state.selectedFields.includes(x)?'checked':''}/> ${x}</label>`).join('')}</div><p class="mini muted">名刺画像や全件DBは送信しません。プロバイダー契約・保持条件は本番で審査が必要です。</p>`,confirm:'デモで承認操作を見る',requiresAi:true},
merge:{title:'人物の統合を確認',desc:'同じ人物として登録済みの名刺に履歴を追加します。会社・役職・交換時点の情報は消去しません。',content:'<div class="alert warn">統合前にメールと所属履歴を再確認してください。MVPでは承認なしに統合しません。</div>',confirm:'統合を承認（デモ）'},
separate:{title:'別人として保持',desc:'似た名刺ですが別人と判断し、重複候補を閉じます。',content:'<div class="alert">この判断は候補履歴として残す設計です。</div>',confirm:'別人と確定（デモ）'},
pair:{title:'PCを追加する',desc:'既存のiPhoneでPC接続を承認し、端末間で復号鍵を安全に引き渡します。',content:'<div class="alert">本番では有効期限つきペアリングコード、端末同士の鍵確認、復旧キーによる代替復元を実装します。</div>',confirm:'手順を確認'},
backup:{title:'バックアップの作成',desc:'本人確認後に、復旧キーで保護された暗号化バックアップを作成します。',content:'<div class="alert warn">未暗号化のCSVや画像を自動で出力しない設計です。</div>',confirm:'操作の流れを確認'},
restore:{title:'別端末で復元する',desc:'復旧キーと暗号化バックアップから別端末上で復号します。',content:'<div class="alert warn">鍵の紛失時に運営側で復号できないため、復旧テストを公開前に必須とします。</div>',confirm:'手順を確認'},
export:{title:'書き出し前に再認証',desc:'選択人数と対象フィールドを確認します。実際のファイル生成には再認証が必要です。',content:'<div class="alert warn">このデモではファイル出力は行いません。</div>',confirm:'再認証フローを確認'},
};const d=defs[name==='ai-consent'?'AI_CONSENT':name];if(!d)return'';return `<div class="modal-bg" id="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="${d.title}"><h2>${d.title}</h2><p>${d.desc}</p>${d.content}<div class="modal-actions"><button class="btn" id="modal-close">戻る</button><button class="btn btn-primary" id="modal-confirm" ${d.requiresAi&&!state.toggles.ai?'disabled':''}>${d.confirm}</button></div>${d.requiresAi&&!state.toggles.ai?'<p class="mini" style="color:var(--red);margin:8px 0 0">外部AIの設定がOFFのため承認できません。設定画面での許可が必要です。</p>':''}</div></div>`}
function showModal(which){modalName=which;document.body.insertAdjacentHTML('beforeend',modalHtml(which));let o=document.getElementById('modal-bg');o.addEventListener('click',e=>{if(e.target===o)closeModal()});document.getElementById('modal-close').onclick=closeModal;document.getElementById('modal-confirm').onclick=()=>{if(which==='enable-ai'){state.toggles.ai=true;state.audit.unshift(['10/21 22:43','外部AI利用設定の変更（デモ）','許可']);}if(which==='ai-consent'){let fs=[...document.querySelectorAll('.consent-field:checked')].map(x=>x.value);if(fs.length===0){toast('少なくとも1項目を選択してください');return}state.selectedFields=fs;state.audit.unshift(['10/21 22:43','外部AI送信の承認を試行（デモ）','許可']);}toast('デモのため実処理は行いません');closeModal();render()}}
function closeModal(){document.getElementById('modal-bg')?.remove();modalName=''}
let toastTimer;function toast(msg){document.getElementById('toast')?.remove();let x=document.createElement('div');x.id='toast';x.className='toast';x.textContent=msg;document.body.appendChild(x);clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.remove(),2900)}
function render(){document.getElementById('app').innerHTML=layout((views[state.view]||home)());document.body.classList.toggle('mobile-preview',state.preview);attach();}
function attach(){document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)));document.querySelectorAll('[data-person]').forEach(el=>el.addEventListener('click',()=>{state.sel=el.dataset.person;go('person')}));document.querySelectorAll('[data-modal]').forEach(el=>el.addEventListener('click',()=>showModal(el.dataset.modal)));document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click',()=>{state.filter=el.dataset.filter;render();document.getElementById('person-search')?.focus()}));document.querySelectorAll('[data-toggle]').forEach(el=>el.addEventListener('click',()=>{let k=el.dataset.toggle;if(k==='ai'&&!state.toggles.ai){showModal('enable-ai')}else{state.toggles[k]=!state.toggles[k];render()}}));document.querySelectorAll('[data-ai-prompt]').forEach(el=>el.addEventListener('click',()=>{document.getElementById('ai-prompt').value=el.dataset.aiPrompt;document.getElementById('ai-prompt').focus()}));document.querySelectorAll('[data-task]').forEach(el=>el.addEventListener('change',()=>{let t=state.tasks.find(x=>x.id===Number(el.dataset.task));if(t)t.done=el.checked;render()}));const preview=document.getElementById('preview-toggle');if(preview)preview.onclick=()=>{state.preview=!state.preview;render()};const search=document.getElementById('person-search');if(search)search.addEventListener('input',()=>{state.query=search.value;const results=document.getElementById('people-results');const rows=listItems();results.innerHTML=rows.length?rows.map(p=>`<div class="person-item ${p.id===state.sel?'active':''}" data-person="${p.id}">${av(p)}<div class="flex-1"><div class="name">${E(p.name)}</div><div class="desc">${E(p.company)}</div><div class="desc">${E(p.title)} / ${E(p.date)}</div></div>${I('right')}</div>`).join(''):'<div class="empty">該当する人物がありません</div>';results.querySelectorAll('[data-person]').forEach(el=>el.addEventListener('click',()=>{state.sel=el.dataset.person;go('person')}))});
const shutter=document.getElementById('shutter');if(shutter)shutter.onclick=()=>{state.scanCount++;toast('サンプル名刺を1枚追加しました');render()};const face=document.getElementById('face-switch');if(face)face.onclick=()=>{state.backFace=!state.backFace;render()};const files=document.getElementById('image-import');if(files)files.onchange=()=>{let n=files.files.length;state.scanCount+=n;toast(`${n}個のファイルをデモキューに追加（読み取り・保存はしません）`);render()};const editForm=document.getElementById('edit-form');if(editForm)editForm.onsubmit=e=>{e.preventDefault();let p=getP();let d=new FormData(editForm);for(let [k,v] of d)p[k]=String(v);p.state='確認済み';toast('サンプルデータを更新しました');go('person')};const reviewForm=document.getElementById('review-form');if(reviewForm)reviewForm.onsubmit=e=>{e.preventDefault();let p=getP();let d=new FormData(reviewForm);for(let [k,v] of d)p[k]=String(v);p.state='確認済み';state.audit.unshift(['10/21 22:43','OCR結果の登録（デモ）','成功']);toast('内容を確認して登録しました（デモ）');go('person')};const aiForm=document.getElementById('ai-form');if(aiForm)aiForm.onsubmit=e=>{e.preventDefault();let q=String(new FormData(aiForm).get('prompt')||'').trim();if(!q)return;let p=q.includes('AWS')?persons[2]:q.includes('AI')||q.includes('勉強会')?persons[1]:q.includes('佐藤')?persons[0]:persons[4];let a=q.includes('お礼')?'下書きは「連絡文の下書き」画面で作成できます。送信は行いません。':`${p.name}さんが候補です。${p.event}で交換し、メモには「${p.memo}」と記録されています。`;state.aiReplies.push({q,a});render()};const copy=document.getElementById('copy-draft');if(copy)copy.onclick=async()=>{let txt=(document.getElementById('draft-subject')?.value||'')+'\n\n'+(document.getElementById('draft-body')?.value||'');state.localDraft=document.getElementById('draft-body')?.value||'';try{await navigator.clipboard.writeText(txt);toast('下書きをコピーしました')}catch{toast('ブラウザの権限でコピーできませんでした')}};const add=document.getElementById('add-task');if(add)add.onclick=()=>{state.tasks.push({id:Date.now(),title:'新しいフォローアップを確認する',when:'日程未定',contact:null,done:false});toast('サンプルタスクを追加しました');render()};}
render();
</script>
</body></html>
